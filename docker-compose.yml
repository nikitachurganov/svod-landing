services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # База в именованном томе (не затирается при монтировании кода)
      - db-data:/app/data
      # Код с хоста — шаблоны и static подхватываются без пересборки образа
      - .:/app
    environment:
      - SECRET_KEY=change-me-in-production
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
      - DB_DIR=/app
    restart: unless-stopped

volumes:
  db-data:
