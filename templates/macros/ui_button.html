{# Переиспользуемая кнопка: <a> при href, иначе <button>.
   variant: primary | secondary | ghost — у всех один и тот же набор размеров.
   size: md | sm | xs. По умолчанию md; для вторичных действий задавайте size='sm', для компактных — size='xs'. #}
{% macro ui_button(text, href=none, variant='primary', size=none, extra_class='', button_type='button') -%}
{% set sz = size if size else 'md' %}
{% set class_str = 'ui-btn ui-btn--' ~ variant ~ ' ui-btn--' ~ sz ~ (' ' ~ extra_class if extra_class else '') %}
{% if href %}
<a href="{{ href }}" class="{{ class_str }}">{{ text }}</a>
{% else %}
<button type="{{ button_type }}" class="{{ class_str }}">{{ text }}</button>
{% endif %}
{%- endmacro %}
