<div class="container">
<section class="video-section" id="demo-video" aria-label="Видео о сервисе">
    <div class="video-section__card">
        <div class="video-section__header-bar">
            <div class="video-section__dots" aria-hidden="true">
                <span class="video-section__dot video-section__dot--red"></span>
                <span class="video-section__dot video-section__dot--yellow"></span>
                <span class="video-section__dot video-section__dot--green"></span>
            </div>
        </div>
        <div class="video-section__body">
            <div class="video-section__frame">
                <video
                    class="video-section__media"
                    controls
                    playsinline
                    preload="metadata">
                    <source src="{{ url_for('static', filename='videos/promo.mp4') }}" type="video/mp4">
                </video>
            </div>
        </div>
    </div>
</section>
</div>
