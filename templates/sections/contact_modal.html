<div class="modal-overlay" id="contactModal">
    <div class="modal">
        <button class="modal__close" type="button" aria-label="Закрыть">&times;</button>
        <h2 class="modal__title text-h3">Связаться с нами</h2>
        <p class="modal__subtitle text-body-s">Заполните форму и мы свяжемся с вами</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="modal__errors">
            {% for category, message in messages %}
            <p class="modal__error">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="modal__errors modal__errors--ajax" id="contactFormErrors" hidden></div>

        <form method="POST" action="{{ url_for('main.contact') }}" class="modal__form" id="contactForm">
            <div class="modal__field">
                <label class="modal__label" for="full_name">ФИО</label>
                <input class="modal__input" type="text" id="full_name" name="full_name" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="modal__field">
                <label class="modal__label" for="phone">Номер телефона</label>
                <input class="modal__input" type="text" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
            </div>
            <div class="modal__field">
                <label class="modal__label" for="email">Email</label>
                <input class="modal__input" type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
            <div class="modal__field">
                <label class="modal__label" for="industry">Сфера деятельности</label>
                <select class="modal__input" id="industry" name="industry" required>
                    <option value="" disabled selected>Выберите сферу</option>
                    <option value="IT и разработка">IT и разработка</option>
                    <option value="Финансы и банки">Финансы и банки</option>
                    <option value="Маркетинг и реклама">Маркетинг и реклама</option>
                    <option value="Образование">Образование</option>
                    <option value="Медицина">Медицина</option>
                    <option value="Производство">Производство</option>
                    <option value="Розничная торговля">Розничная торговля</option>
                    <option value="Логистика">Логистика</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div class="modal__field">
                <label class="modal__label" for="position">Должность / Специализация</label>
                <input class="modal__input" type="text" id="position" name="position" placeholder="Менеджер проектов" required>
            </div>
            <button type="submit" class="ui-btn ui-btn--primary modal__submit" id="contactFormSubmit">Отправить заявку</button>
        </form>
    </div>
</div>
