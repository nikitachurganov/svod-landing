<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админ-панель{% endblock %} — Svod</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
    <aside class="admin-sidebar">
        <a class="admin-sidebar__logo" href="{{ url_for('admin.contacts') }}">
            <img src="{{ url_for('static', filename='icons/logo.svg') }}" width="67" height="17" alt="Svod">
            <span class="admin-sidebar__badge">admin</span>
        </a>
        <nav class="admin-sidebar__nav">
            <a href="{{ url_for('admin.contacts') }}"
               class="admin-sidebar__link {% if request.endpoint == 'admin.contacts' %}admin-sidebar__link--active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Заявки
            </a>
            <a href="{{ url_for('admin.content') }}"
               class="admin-sidebar__link {% if request.endpoint == 'admin.content' %}admin-sidebar__link--active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Контент
            </a>
            <a href="{{ url_for('admin.pricing') }}"
               class="admin-sidebar__link {% if request.endpoint == 'admin.pricing' %}admin-sidebar__link--active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Тарифы
            </a>
        </nav>
        <div class="admin-sidebar__footer">
            <a href="{{ url_for('main.index') }}" class="admin-sidebar__link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                На сайт
            </a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <h1 class="admin-topbar__title">{% block page_title %}Админ-панель{% endblock %}</h1>
            <div class="admin-topbar__actions">{% block page_actions %}{% endblock %}</div>
        </header>
        <div class="admin-content">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
